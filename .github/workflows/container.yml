name: Container CI

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  NEXT_TELEMETRY_DISABLED: "1"
  # Single source of truth for "this run publishes an image".
  PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

jobs:
  # One job only. GitHub bills every job rounded UP to a whole minute, so the previous
  # verify / container / notify split cost a 3-minute floor on a ~4m50s run.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock

      # Runs once. Previously this ran here AND again inside the Docker `dependencies`
      # stage, with the Next.js production build repeated in the `build` stage.
      - name: Install dependencies
        run: corepack enable && yarn install --frozen-lockfile --prefer-offline

      - name: Lint and build
        id: verify
        run: |
          yarn lint
          yarn build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=long

      # No cache-from/cache-to: the image is now a node:22-alpine base plus three COPY
      # layers, so there is nothing expensive left to cache and the GHA round-trip would
      # cost more time than it saves.
      - name: Build and optionally publish image
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Attestations are only meaningful for images that actually get pushed.
          provenance: ${{ env.PUBLISH == 'true' && 'mode=min' || 'false' }}
          sbom: ${{ env.PUBLISH == 'true' }}

      # These images are ~360 MB uncompressed. GitHub Free allows 500 MB of Packages
      # storage across the whole org, so retention has to be short.
      - name: Prune old image versions
        if: env.PUBLISH == 'true'
        continue-on-error: true
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ github.event.repository.name }}
          package-type: container
          min-versions-to-keep: 3
          delete-only-untagged-versions: false

      - name: Send Telegram notification
        if: always()
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VERIFY_RESULT: ${{ steps.verify.outcome }}
          CONTAINER_RESULT: ${{ steps.publish.outcome }}
        run: |
          if [[ -z "$TELEGRAM_BOT_TOKEN" || -z "$TELEGRAM_CHAT_ID" ]]; then
            echo "::warning::Telegram notification skipped: TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID is not configured"
            exit 0
          fi

          if [[ "$VERIFY_RESULT" == "failure" || "$CONTAINER_RESULT" == "failure" ]]; then
            ICON="❌"
            STATUS="FAILED"
          elif [[ "$VERIFY_RESULT" == "cancelled" || "$CONTAINER_RESULT" == "cancelled" ]]; then
            ICON="⚠️"
            STATUS="CANCELLED"
          elif [[ "$PUBLISH" == "true" && "$VERIFY_RESULT" == "success" && "$CONTAINER_RESULT" == "success" ]]; then
            ICON="✅"
            STATUS="PUBLISHED"
          else
            ICON="⚠️"
            STATUS="VALIDATED — NOT PUBLISHED"
          fi

          SHORT_SHA="${GITHUB_SHA:0:7}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          IMAGE_REF="ghcr.io/${GITHUB_REPOSITORY}:sha-${GITHUB_SHA}"

          printf -v MESSAGE '%s Container CI %s\n\nRepository: %s\nEvent: %s\nBranch: %s\nCommit: %s\nActor: %s\nVerify: %s\nContainer: %s' \
            "$ICON" "$STATUS" "$GITHUB_REPOSITORY" "${{ github.event_name }}" "${GITHUB_REF_NAME:-unknown}" "$SHORT_SHA" "${{ github.actor }}" "$VERIFY_RESULT" "$CONTAINER_RESULT"

          if [[ "$STATUS" == "PUBLISHED" ]]; then
            MESSAGE+=$'\nImage: '
            MESSAGE+="$IMAGE_REF"
          fi

          MESSAGE+=$'\nRun: '
          MESSAGE+="$RUN_URL"

          if ! curl --fail-with-body --silent --show-error \
            --retry 3 --retry-all-errors --connect-timeout 10 --max-time 30 \
            --request POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}" \
            --data-urlencode "disable_web_page_preview=true" \
            --output /dev/null; then
            echo "::warning::Telegram notification could not be delivered"
          fi
